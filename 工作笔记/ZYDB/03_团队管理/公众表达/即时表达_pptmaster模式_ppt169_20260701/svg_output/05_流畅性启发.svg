<text x="1220" y="58" font-family="Microsoft YaHei" font-size="14" fill="#64748B" text-anchor="end">04 / 06</text>
<circle cx="640" cy="290" r="120" fill="#2563EB"/>
<circle cx="640" cy="290" r="100" fill="#0F2A43"/>
<text x="640" y="265" font-family="Microsoft YaHei" font-size="14" fill="#60A5FA" text-anchor="middle">CORE PRINCIPLE</text>
<text x="640" y="300" font-family="Microsoft YaHei" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle">流畅性启发</text>
<text x="640" y="328" font-family="Microsoft YaHei" font-size="14" fill="#93C5FD" text-anchor="middle">认知压榨的本质</text>
<rect x="440" y="130" width="400" height="35" fill="#F8FAFC" rx="4"/>
<text x="640" y="154" font-family="Microsoft YaHei" font-size="15" fill="#475569" text-anchor="middle">大脑依赖信息处理的主观体验</text>
<line x1="530" y1="280" x2="280" y2="280" stroke="#22C55E" stroke-width="2" stroke-dasharray="6,3"/>
<polygon points="285,275 270,280 285,285" fill="#22C55E"/>
<rect x="60" y="240" width="210" height="90" fill="#F0FDF4" rx="8"/>
<rect x="60" y="240" width="5" height="90" fill="#22C55E" rx="2.5"/>
<text x="85" y="270" font-family="Microsoft YaHei" font-size="16" fill="#16A34A" font-weight="bold">感觉轻松</text>
<text x="85" y="295" font-family="Microsoft YaHei" font-size="14" fill="#475569">= 感觉正确</text>
<text x="85" y="317" font-family="Microsoft YaHei" font-size="13" fill="#94A3B8">处理顺畅 → 判断可信</text>
<line x1="750" y1="280" x2="1000" y2="280" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,3"/>
<polygon points="995,275 1010,280 995,285" fill="#EF4444"/>
<rect x="1010" y="240" width="210" height="90" fill="#FEF2F2" rx="8"/>
<rect x="1215" y="240" width="5" height="90" fill="#EF4444" rx="2.5"/>
<text x="1190" y="270" font-family="Microsoft YaHei" font-size="16" fill="#DC2626" font-weight="bold" text-anchor="end">感觉困难</text>
<text x="1190" y="295" font-family="Microsoft YaHei" font-size="14" fill="#475569" text-anchor="end">= 感觉可疑</text>
<text x="1190" y="317" font-family="Microsoft YaHei" font-size="13" fill="#94A3B8" text-anchor="end">处理吃力 → 不信任</text>
<rect x="60" y="430" width="1160" height="100" fill="#FFFBEB" rx="8"/>
<text x="100" y="465" font-family="Microsoft YaHei" font-size="16" fill="#E8A838" font-weight="bold">启示</text>
