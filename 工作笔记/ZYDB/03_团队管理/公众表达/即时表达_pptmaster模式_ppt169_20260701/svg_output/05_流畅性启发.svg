<text x="80" y="600" font-family="Microsoft YaHei" font-size="15" fill="#2563EB" font-weight="bold">策略 1</text>
<text x="80" y="625" font-family="Microsoft YaHei" font-size="14" fill="#475569">提前准备安全观点</text>
<text x="80" y="650" font-family="Microsoft YaHei" font-size="13" fill="#94A3B8">调取 + 筛选 + 组织</text>
<rect x="455" y="570" width="370" height="110" fill="#F8FAFC" rx="8"/>
<text x="475" y="600" font-family="Microsoft YaHei" font-size="15" fill="#2563EB" font-weight="bold">策略 2</text>
<text x="475" y="625" font-family="Microsoft YaHei" font-size="14" fill="#475569">降低认知负担</text>
<text x="475" y="650" font-family="Microsoft YaHei" font-size="13" fill="#94A3B8">短句 + 口语化 + 重复</text>
<rect x="850" y="570" width="370" height="110" fill="#F8FAFC" rx="8"/>
<text x="870" y="600" font-family="Microsoft YaHei" font-size="15" fill="#2563EB" font-weight="bold">策略 3</text>
<text x="870" y="625" font-family="Microsoft YaHei" font-size="14" fill="#475569">结构化表达</text>
<text x="870" y="650" font-family="Microsoft YaHei" font-size="13" fill="#94A3B8">钩子 + 结论 + 观点 + 行动</text>
