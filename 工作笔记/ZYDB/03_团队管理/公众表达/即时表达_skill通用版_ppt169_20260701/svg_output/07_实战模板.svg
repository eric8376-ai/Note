<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#FFFFFF"/>
<rect x="0" y="0" width="1280" height="90" fill="#1B3A5C"/>
<text x="60" y="58" font-family="Microsoft YaHei" font-size="28" fill="#FFFFFF" font-weight="bold">实战模板：内部汇报发言稿</text>
<text x="1220" y="58" font-family="Microsoft YaHei" font-size="14" fill="#666666" text-anchor="end">06 / 06</text>
<text x="60" y="130" font-family="Microsoft YaHei" font-size="18" fill="#1B3A5C" font-weight="bold">结构要求</text>
<rect x="60" y="140" width="40" height="2" fill="#E87722"/>
<rect x="60" y="160" width="370" height="160" fill="#F5F7FA" rx="8"/>
<circle cx="100" cy="195" r="18" fill="#4A90D9"/>
<text x="100" y="201" font-family="Microsoft YaHei" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<text x="135" y="201" font-family="Microsoft YaHei" font-size="17" fill="#1B3A5C" font-weight="bold">结论放第一句</text>
<text x="80" y="240" font-family="Microsoft YaHei" font-size="14" fill="#333333">开门见山，先说结论</text>
<text x="80" y="265" font-family="Microsoft YaHei" font-size="14" fill="#333333">再展开理由</text>
<rect x="80" y="285" width="330" height="1" fill="#E0E0E0"/>
<text x="80" y="307" font-family="Microsoft YaHei" font-size="13" fill="#666666">范例：关于X，建议启动。</text>
<rect x="455" y="160" width="370" height="160" fill="#F5F7FA" rx="8"/>
<circle cx="495" cy="195" r="18" fill="#4A90D9"/>
<text x="495" y="201" font-family="Microsoft YaHei" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text>
<text x="530" y="201" font-family="Microsoft YaHei" font-size="17" fill="#1B3A5C" font-weight="bold">2-3 个理由</text>
<text x="475" y="240" font-family="Microsoft YaHei" font-size="14" fill="#333333">用第一第二第三</text>
<text x="475" y="265" font-family="Microsoft YaHei" font-size="14" fill="#333333">清晰列出</text>
<rect x="475" y="285" width="330" height="1" fill="#E0E0E0"/>
<text x="475" y="307" font-family="Microsoft YaHei" font-size="13" fill="#666666">范例：第一…第二…第三…</text>
<rect x="850" y="160" width="370" height="160" fill="#F5F7FA" rx="8"/>
<circle cx="890" cy="195" r="18" fill="#4A90D9"/>
<text x="890" y="201" font-family="Microsoft YaHei" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
<text x="925" y="201" font-family="Microsoft YaHei" font-size="17" fill="#1B3A5C" font-weight="bold">建议收尾</text>
<text x="870" y="240" font-family="Microsoft YaHei" font-size="14" fill="#333333">我的建议是____</text>
<text x="870" y="265" font-family="Microsoft YaHei" font-size="14" fill="#333333">给出明确行动项</text>
<rect x="870" y="285" width="330" height="1" fill="#E0E0E0"/>
<text x="870" y="307" font-family="Microsoft YaHei" font-size="13" fill="#666666">范例：建议本周五前立项。</text>
<text x="60" y="375" font-family="Microsoft YaHei" font-size="18" fill="#1B3A5C" font-weight="bold">风格要求</text>
<rect x="60" y="385" width="40" height="2" fill="#E87722"/>
<rect x="60" y="405" width="180" height="55" fill="#FFF8F0" rx="6"/>
<text x="150" y="440" font-family="Microsoft YaHei" font-size="16" fill="#E87722" font-weight="bold" text-anchor="middle">自信果断</text>
<rect x="255" y="405" width="180" height="55" fill="#FFF8F0" rx="6"/>
<text x="345" y="440" font-family="Microsoft YaHei" font-size="16" fill="#E87722" font-weight="bold" text-anchor="middle">严谨冷静</text>
<rect x="450" y="405" width="180" height="55" fill="#EBF4FC" rx="6"/>
<text x="540" y="440" font-family="Microsoft YaHei" font-size="16" fill="#4A90D9" font-weight="bold" text-anchor="middle">口语化</text>
<rect x="645" y="405" width="180" height="55" fill="#EBF4FC" rx="6"/>
<text x="735" y="440" font-family="Microsoft YaHei" font-size="16" fill="#4A90D9" font-weight="bold" text-anchor="middle">短句为主</text>
<rect x="840" y="405" width="180" height="55" fill="#EBF4FC" rx="6"/>
<text x="930" y="440" font-family="Microsoft YaHei" font-size="16" fill="#4A90D9" font-weight="bold" text-anchor="middle">避免术语嵌套</text>
<rect x="1035" y="405" width="180" height="55" fill="#EBF4FC" rx="6"/>
<text x="1125" y="440" font-family="Microsoft YaHei" font-size="16" fill="#4A90D9" font-weight="bold" text-anchor="middle">允许语气词</text>
<rect x="60" y="490" width="1160" height="100" fill="#F5F7FA" rx="8"/>
<text x="80" y="520" font-family="Microsoft YaHei" font-size="15" fill="#1B3A5C" font-weight="bold">完整范例</text>
<text x="80" y="548" font-family="Microsoft YaHei" font-size="15" fill="#333333">领导，关于X项目，我建议立即启动。第一，市场窗口仅剩3个月；</text>
<text x="80" y="573" font-family="Microsoft YaHei" font-size="15" fill="#333333">第二，技术方案已验证；第三，团队已就绪。我的建议是本周五前完成立项。</text>
<rect x="60" y="620" width="1160" height="70" fill="#1B3A5C" rx="8"/>
<text x="640" y="665" font-family="Microsoft YaHei" font-size="22" fill="#E87722" font-weight="bold" text-anchor="middle">核心：让听众轻松听懂 — 感觉轻松 = 感觉正确</text>
</svg>