<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#FFFFFF"/>
<rect x="0" y="0" width="1280" height="90" fill="#0F2A43"/>
<text x="60" y="58" font-family="Microsoft YaHei" font-size="28" fill="#FFFFFF" font-weight="bold">场景表达模式</text>
<text x="1220" y="58" font-family="Microsoft YaHei" font-size="14" fill="#64748B" text-anchor="end">05 / 06</text>
<rect x="60" y="120" width="520" height="120" fill="#FFFBEB" rx="8"/>
<rect x="60" y="120" width="6" height="120" fill="#E8A838" rx="3"/>
<text x="90" y="155" font-family="Microsoft YaHei" font-size="14" fill="#E8A838" font-weight="bold">STEP 1</text>
<text x="90" y="185" font-family="Microsoft YaHei" font-size="22" fill="#0F2A43" font-weight="bold">钩子</text>
<text x="220" y="185" font-family="Microsoft YaHei" font-size="16" fill="#475569">关于X，我需要您……</text>
<text x="90" y="215" font-family="Microsoft YaHei" font-size="14" fill="#94A3B8">具体提到项目名 + 你的需求</text>
<polygon points="310,245 300,255 320,255" fill="#94A3B8"/>
<rect x="308" y="245" width="4" height="10" fill="#94A3B8"/>
<rect x="90" y="265" width="520" height="120" fill="#EFF6FF" rx="8"/>
<rect x="90" y="265" width="6" height="120" fill="#2563EB" rx="3"/>
<text x="120" y="300" font-family="Microsoft YaHei" font-size="14" fill="#2563EB" font-weight="bold">STEP 2</text>
<text x="120" y="330" font-family="Microsoft YaHei" font-size="22" fill="#0F2A43" font-weight="bold">结论</text>
<text x="220" y="330" font-family="Microsoft YaHei" font-size="16" fill="#475569">直接说出核心结论</text>
<text x="120" y="360" font-family="Microsoft YaHei" font-size="14" fill="#94A3B8">开门见山，不绕弯子</text>
<polygon points="340,390 330,400 350,400" fill="#94A3B8"/>
<rect x="338" y="390" width="4" height="10" fill="#94A3B8"/>
<rect x="120" y="410" width="520" height="120" fill="#F8FAFC" rx="8"/>
<rect x="120" y="410" width="6" height="120" fill="#0F2A43" rx="3"/>
<text x="150" y="445" font-family="Microsoft YaHei" font-size="14" fill="#0F2A43" font-weight="bold">STEP 3</text>
<text x="150" y="475" font-family="Microsoft YaHei" font-size="22" fill="#0F2A43" font-weight="bold">观点摘要</text>
<text x="310" y="475" font-family="Microsoft YaHei" font-size="16" fill="#475569">重要观点简要概括</text>
<text x="150" y="505" font-family="Microsoft YaHei" font-size="14" fill="#94A3B8">不超过3个，第一第二第三</text>
<polygon points="370,535 360,545 380,545" fill="#94A3B8"/>
<rect x="368" y="535" width="4" height="10" fill="#94A3B8"/>
<rect x="150" y="555" width="520" height="120" fill="#FFF7ED" rx="8"/>
<rect x="150" y="555" width="6" height="120" fill="#EA580C" rx="3"/>
<text x="180" y="590" font-family="Microsoft YaHei" font-size="14" fill="#EA580C" font-weight="bold">STEP 4</text>
<text x="180" y="620" font-family="Microsoft YaHei" font-size="22" fill="#0F2A43" font-weight="bold">行动指南</text>
<text x="340" y="620" font-family="Microsoft YaHei" font-size="16" fill="#475569">下一步具体建议</text>
<text x="180" y="650" font-family="Microsoft YaHei" font-size="14" fill="#94A3B8">给明确时间节点，我的建议是……</text>
<rect x="700" y="120" width="520" height="555" fill="#F8FAFC" rx="8"/>
<rect x="700" y="120" width="520" height="50" fill="#0F2A43" rx="8"/>
<rect x="700" y="150" width="520" height="20" fill="#0F2A43"/>
<text x="960" y="153" font-family="Microsoft YaHei" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="middle">范例演示</text>
<text x="730" y="210" font-family="Microsoft YaHei" font-size="16" fill="#E8A838" font-weight="bold">钩子 + 结论：</text>
<text x="740" y="240" font-family="Microsoft YaHei" font-size="16" fill="#0F2A43">领导，关于A项目，</text>
<text x="740" y="265" font-family="Microsoft YaHei" font-size="16" fill="#0F2A43">我建议立即启动。</text>
<text x="730" y="310" font-family="Microsoft YaHei" font-size="16" fill="#2563EB" font-weight="bold">观点摘要：</text>
<text x="740" y="340" font-family="Microsoft YaHei" font-size="16" fill="#0F2A43">第一，市场窗口仅剩3个月；</text>
<text x="740" y="365" font-family="Microsoft YaHei" font-size="16" fill="#0F2A43">第二，技术方案已验证；</text>
<text x="740" y="390" font-family="Microsoft YaHei" font-size="16" fill="#0F2A43">第三，团队已就绪。</text>
<text x="730" y="435" font-family="Microsoft YaHei" font-size="16" fill="#EA580C" font-weight="bold">行动指南：</text>
<text x="740" y="465" font-family="Microsoft YaHei" font-size="16" fill="#0F2A43">建议本周五前完成立项。</text>
<line x1="730" y1="500" x2="1190" y2="500" stroke="#E2E8F0"/>
<text x="730" y="530" font-family="Microsoft YaHei" font-size="13" fill="#94A3B8">钩子具体（项目名+需求）</text>
<text x="730" y="555" font-family="Microsoft YaHei" font-size="13" fill="#94A3B8">结论果断（不绕弯子）</text>
<text x="730" y="580" font-family="Microsoft YaHei" font-size="13" fill="#94A3B8">观点不超过3个</text>
<text x="730" y="605" font-family="Microsoft YaHei" font-size="13" fill="#94A3B8">行动明确（给时间节点）</text>
<text x="730" y="630" font-family="Microsoft YaHei" font-size="13" fill="#94A3B8">语言口语化、自信严谨</text>
</svg>